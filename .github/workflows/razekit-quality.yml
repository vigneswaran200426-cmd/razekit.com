name: RazeKit quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'redesign/**']

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (autofix then verify)
        run: npm run lint:fix && npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
